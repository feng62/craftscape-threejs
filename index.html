<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craftscape - Three.js WebGPU/GPGPU 水动力学与侵蚀模拟</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app"></div>
  <div id="instructions">
    <b>控制说明：</b><br/>
    按住鼠标左键拖拽：旋转视角 | W/A/S/D/Q/E：移动视角<br/>
    按住空格键 (Space) + 鼠标划过：进行地形与水体雕刻编辑<br/>
    笔刷半径：在右侧 GUI 面板中滑块调节
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
